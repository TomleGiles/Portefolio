<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tom Giles — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Syne+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #080808;
      color: #f0f0f0;
      font-family: 'Syne', sans-serif;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.045;
      pointer-events: none;
      z-index: 100;
    }

    .grid-lines {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(#141414 1px, transparent 1px),
        linear-gradient(90deg, #141414 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      padding: clamp(2rem, 8vw, 8rem);
    }

    .tag {
      font-family: 'Syne Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #888;
      border: 1px solid #222;
      padding: 0.35em 0.9em;
      display: inline-block;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.6s 0.2s ease forwards;
    }

    h1 {
      font-size: clamp(4rem, 11vw, 10rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.4s ease forwards;
    }

    h1 .name-first { display: block; color: #f0f0f0; }
    h1 .name-last  {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1.5px #333;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-family: 'Syne Mono', monospace;
      font-size: 0.78rem;
      color: #444;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 0.7s 0.6s ease forwards;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #f0f0f0;
      animation: pulse 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.2; transform: scale(0.6); }
    }

    .corner {
      position: fixed;
      bottom: 2.5rem;
      right: 2.5rem;
      font-family: 'Syne Mono', monospace;
      font-size: 0.65rem;
      color: #333;
      text-align: right;
      line-height: 2;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 0.6s 0.8s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="grid-lines"></div>

  <div class="container">
    <span class="tag">✦ En construction</span>

    <h1>
      <span class="name-first">Tom</span>
      <span class="name-last">Giles</span>
    </h1>

    <div class="status">
      <span class="dot"></span>
      <span>Portfolio en cours de développement</span>
    </div>
  </div>

  <div class="corner">
    tom.giles.fr<br/>
    Paris, France
  </div>

</body>
</html>
